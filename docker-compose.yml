services:
  postgres:
    image: postgres:16-alpine
    container_name: roster_postgres
    environment:
      POSTGRES_DB: roster_db
      POSTGRES_USER: roster_user
      POSTGRES_PASSWORD: roster_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster_user -d roster_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roster_app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

volumes:
  pgdata:
