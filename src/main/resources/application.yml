server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/roster_db}
    username: ${DB_USERNAME:roster_user}
    password: ${DB_PASSWORD:roster_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

app:
  jwt:
    secret: ${JWT_SECRET:defaultDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm123}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  roster:
    rest-hours: ${ROSTER_REST_HOURS:8}
    regular-work-hours-per-day: ${ROSTER_REGULAR_HOURS:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
